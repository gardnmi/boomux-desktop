name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  checks:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub workflows
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXXXX")
          curl -fsSL --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$tool_dir/actionlint.tar.gz"
          printf '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  %s\n' \
            "$tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck= -pyflakes=

      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n packaging/boomux-desktop
          sh -n scripts/package-release.sh
          bash -n scripts/memory-report.sh
          bash -n scripts/publish-release.sh

      - name: Test installer
        run: |
          python3 scripts/test-installer.py
          python3 scripts/test-release.py
          python3 scripts/test-smoke.py

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04-zig-0.15.2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked -- --test-threads=1

      - name: Build release binary
        # PRs compile and link tests above. Check optimization on integration
        # commits and explicit CI runs instead of every PR update.
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo build --release --locked

      - name: Read pinned Boomux revision
        if: ${{ github.event_name != 'pull_request' }}
        id: boomux
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              revision = tomllib.load(source)['dependencies']['boomux']['rev']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + revision, file=output)
          PY

      - name: Check out pinned Boomux
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gardnmi/boomux
          ref: ${{ steps.boomux.outputs.revision }}
          path: .release-boomux
          persist-credentials: false

      - name: Package candidate with Boomux
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cargo build --release --locked --manifest-path .release-boomux/Cargo.toml --bin boomux
          sh scripts/package-release.sh .release-boomux

      - name: Upload bundle for display tests
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boomux-desktop-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  desktop-smoke:
    if: ${{ github.event_name != 'pull_request' }}
    needs: rust
    uses: ./.github/workflows/desktop-smoke.yml
    with:
      source-ref: ${{ github.sha }}

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit advisories, licenses, and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
